name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require a semantic release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release requires a vX.Y.Z or vX.Y.Z-QUALIFIER tag; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Run release gates
        run: >-
          sbt -batch -J-Xmx4G
          fmtCheck
          image4sCompileAll
          image4sTestAll
          docs/tlSite
          versionPolicyCheck
          versionCheck
      - name: Test optimized Scala.js artifacts
        run: >-
          sbt -batch
          "set Global / scalaJSStage := FullOptStage"
          "image4s-coreJS/test"
          "image4s-niftiJS/test"
          "image4s-locusJS/test"
      - name: Reject unreleased upstream dependencies
        run: |
          sbt -batch makeReleasePoms
          if rg --no-ignore -n '<version>[^<]*(SNAPSHOT|\\+)' modules --glob '*.pom'; then
            echo "Release POMs contain snapshot or dynver upstream dependencies" >&2
            exit 1
          fi
      - name: Publish signed artifacts to Maven Central
        run: sbt -batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
